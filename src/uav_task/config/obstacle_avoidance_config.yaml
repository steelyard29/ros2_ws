# 航点导航与避障算法配置文件
# 注意：为了安全，这些参数在运行时不可修改

# PID位置控制器配置
position_controller:
  # P控制增益
  kp_x: 0.8                           # X轴比例增益
  kp_y: 0.8                           # Y轴比例增益  
  kp_z: 0.6                           # Z轴比例增益
  
  # D控制增益（少量）
  kd_x: 0.1                           # X轴微分增益
  kd_y: 0.1                           # Y轴微分增益
  kd_z: 0.05                          # Z轴微分增益
  
  # I控制增益（暂时不使用）
  ki_x: 0.0                           # X轴积分增益
  ki_y: 0.0                           # Y轴积分增益
  ki_z: 0.0                           # Z轴积分增益
  
  # 速度限制
  max_velocity_xy: 0.4                # 水平最大速度(m/s)
  max_velocity_z: 0.3                 # 垂直最大速度(m/s)
  
  # 微分滤波
  derivative_filter_alpha: 0.8        # 微分项低通滤波系数
  
  # 位置容差
  position_tolerance: 0.2             # 到达航点的位置容差(m)

# 避障算法配置
obstacle_avoidance:
  # 激光雷达相关
  laser_topic: "/scan"
  
  # 避障参数（启动后不可修改）
  obstacle_distance_threshold: 1.0      # 障碍物距离阈值(m)
  avoidance_fov_degrees: 360.0         # 避障视场角(度)
  avoidance_strength_gain: 0.6         # 斥力增益系数
  
  # 速度限制
  max_avoidance_velocity: 0.3          # 最大避障速度(m/s)
  
  # 激光雷达数据验证
  scan_timeout_ms: 200                 # 扫描数据超时(毫秒)
  min_valid_ranges_ratio: 0.5          # 最小有效点比例
