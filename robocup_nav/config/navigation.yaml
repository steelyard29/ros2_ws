# OFFLINE / SHADOW baseline. 0.70 m footprint is a test fixture, NOT measured hardware.
# Real command topics are never published by this deployment.
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      use_astar: true
      allow_unknown: false
      tolerance: 0.10
controller_server:
  ros__parameters:
    controller_frequency: 15.0
    odom_topic: /robocup/odom
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10
      movement_time_allowance: 15.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.20
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      trajectory_generator_name: dwb_plugins::LimitedAccelGenerator
      sim_period: 0.0666666667
      # Forward-only until side/rear observation coverage has been validated.
      min_vel_x: 0.0
      max_vel_x: 0.25
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.35
      min_speed_xy: 0.0
      max_speed_xy: 0.25
      min_speed_theta: 0.0
      acc_lim_x: 0.30
      acc_lim_y: 0.30
      acc_lim_theta: 0.50
      decel_lim_x: -0.30
      decel_lim_y: -0.30
      decel_lim_theta: -0.50
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 15
      sim_time: 2.0
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.2
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      critics: [RotateToGoal, Oscillation, ObstacleFootprint, PathAlign, PathDist, GoalDist]
      ObstacleFootprint.scale: 1.0
      PathAlign.scale: 12.0
      PathAlign.forward_point_distance: 0.15
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 24.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      footprint: '[[0.35,0.35],[0.35,-0.35],[-0.35,-0.35],[-0.35,0.35]]'
      footprint_padding: 0.03
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: depth
        depth:
          topic: /robocup/obstacles
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_max_range: 3.5
          obstacle_min_range: 0.25
          raytrace_max_range: 4.0
          raytrace_min_range: 0.25
          min_obstacle_height: -5.0
          max_obstacle_height: 5.0
          expected_update_rate: 0.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.50
        cost_scaling_factor: 5.0
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: odom
      robot_base_frame: base_footprint
      update_frequency: 10.0
      publish_frequency: 2.0
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      track_unknown_space: true
      footprint: '[[0.35,0.35],[0.35,-0.35],[-0.35,-0.35],[-0.35,0.35]]'
      footprint_padding: 0.03
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: depth
        depth:
          topic: /robocup/obstacles
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_max_range: 3.5
          obstacle_min_range: 0.25
          raytrace_max_range: 4.0
          raytrace_min_range: 0.25
          min_obstacle_height: -5.0
          max_obstacle_height: 5.0
          expected_update_rate: 0.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.50
        cost_scaling_factor: 5.0
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /robocup/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_rate_controller_bt_node
      - nav2_pipeline_sequence_bt_node
