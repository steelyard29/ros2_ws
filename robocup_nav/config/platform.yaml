# ~0.015 m to PX4 right; PX4 coincident with D435i module/stereo center.
# camera_link is left IR optical origin, not the projector or front glass.
# X: 0.20 m minus datasheet zero-depth-to-glass 4.2 mm → 0.196 m.
# Y: left IR is 25 mm left of the 50 mm stereo midpoint → +0.025 m.
#    Projector at ~15 mm right of center sits between the two IR cameras.
# Z: housing mid-height is the left-IR height → -0.05 m.
